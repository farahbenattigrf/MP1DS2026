
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title> Oued Ellil </title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}
table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}
th {
    background-color: #4CAF50;
    color: white;
}
</style>
</head>
<body>
<p>La consommation à Oued Ellil</p>

<div id="tableau">Chargement du tableau...</div>

<script>
fetch("Consommation-Oued-Ellil.xlsx")
.then(response => {
    if (!response.ok) {
        throw new Error("Fichier Excel introuvable.");
    }
    return response.arrayBuffer();
})
.then(data => {
    const classeur = XLSX.read(data, { type: "array" });
    const feuille = classeur.Sheets[classeur.SheetNames[0]];

    document.getElementById("tableau").innerHTML =
        XLSX.utils.sheet_to_html(feuille);
})
.catch(error => {
    document.getElementById("tableau").textContent =
        "Impossible de charger le fichier Excel. Vérifiez son nom et son emplacement.";
    console.error(error);
});
</script>

</body>
</html>
